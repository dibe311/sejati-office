<style>

:root{--bg:#1b2130;--panel:rgba(22,27,38,.86);--line:#323c50;--ink:#eef2f8;--muted:#98a4b8;

  --work:#27c46a;--recent:#f2a71b;--idle:#8a94a6;--off:#e25555;--accent:#3d7bff}

*{box-sizing:border-box}

html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:600 13px/1.35 Nunito,system-ui,sans-serif}

#stage{position:fixed;inset:0;cursor:grab}

#stage.drag{cursor:grabbing}

#labels{position:fixed;inset:0;pointer-events:none}

.fred{font-family:Fredoka,Nunito,sans-serif}



.hud{position:fixed;left:12px;right:12px;top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;z-index:5;pointer-events:none}

.hud>*{pointer-events:auto}

.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.25)}

.brand{display:flex;align-items:center;gap:8px;padding:6px 12px;font:700 17px Fredoka,sans-serif}

.brand img.logo{height:24px;width:auto;display:block}

.stats{display:flex;gap:2px;padding:4px}

.stat{padding:3px 12px;border-right:1px solid var(--line)}

.stat:last-child{border:0}

.stat small{display:block;color:var(--muted);font-size:10.5px;font-weight:700}

.stat b{font:600 16px Fredoka,sans-serif}

.tabs{display:flex;gap:4px;padding:4px;flex-wrap:wrap}

.tab{border:0;background:transparent;color:var(--muted);font:700 12.5px Nunito,sans-serif;padding:6px 11px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px}

.tab:hover{color:var(--ink);background:rgba(255,255,255,.06)}

.tab[aria-pressed="true"]{background:var(--accent);color:#fff}

.tab .ic{width:18px;height:18px;border-radius:5px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:11px}

.tools{display:flex;gap:4px;padding:4px;margin-left:auto}

.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:700 12.5px Nunito,sans-serif;padding:6px 10px;border-radius:8px;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:5px}

.btn[aria-pressed="true"]{background:#f2a71b;color:#1b1b1b;border-color:#f2a71b}

.legend{position:fixed;left:12px;bottom:12px;z-index:5;display:flex;gap:12px;padding:7px 12px;flex-wrap:wrap;max-width:calc(100vw - 330px)}

.legend span{display:flex;align-items:center;gap:5px;color:var(--muted)}

.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

.d-working{background:var(--work);box-shadow:0 0 0 3px rgba(39,196,106,.3)}.d-recent{background:var(--recent)}.d-idle{background:var(--idle)}.d-offline{background:var(--off)}

.upd{position:fixed;right:12px;bottom:12px;z-index:5;padding:7px 12px;color:var(--muted);font-size:12px}

.hint{color:var(--muted);font-size:11.5px}



.lbl{pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transform:translateY(-4px)}

.tag{display:flex;flex-direction:column;align-items:center;background:rgba(14,18,26,.84);color:#fff;border-radius:8px;padding:2px 8px 3px;font:700 11.5px Nunito,sans-serif;white-space:nowrap;border:1px solid rgba(255,255,255,.12)}

.tag .tn{display:flex;align-items:center;gap:5px}

.tag .dot{width:7px;height:7px}

.tag .tp{margin-top:2px;padding:0 7px;border-radius:5px;font:800 9px/1.55 Nunito,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.45)}

.bub{max-width:190px;background:#fff;color:#1c2230;border-radius:9px;padding:4px 8px;font:700 11px/1.3 Nunito,sans-serif;box-shadow:0 3px 10px rgba(0,0,0,.3);position:relative;text-align:center}

.bub::after{content:"";position:absolute;left:50%;bottom:-5px;width:9px;height:9px;background:#fff;transform:translateX(-50%) rotate(45deg)}

.bub:empty{display:none}

.bub.fix{background:#ffe08a}.bub.fix::after{background:#ffe08a}

.bub.zz{background:transparent;box-shadow:none;color:#c7d0de;font:700 13px Fredoka,sans-serif;padding:0}

.bub.zz::after{display:none}

.far .bub{display:none}.far .tag .tp{font-size:7.5px;padding:0 4px}

.far .tag{padding:1px 6px 2px;font-size:10px}

.far .sign{padding:3px 8px}.far .sign b{font-size:12px}.far .sign span{display:none}

.sign{pointer-events:none;text-align:center;background:rgba(14,18,26,.85);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:5px 12px;white-space:nowrap}

.sign b{font:600 15px Fredoka,sans-serif;display:block}

.sign span{color:#aab4c6;font-size:11px;font-weight:700}

.sign .bad{color:#ff8a8a}

.sign.lobby{background:#e53935;border-color:#ff8a80}

.sign.lobby span{color:#ffe3e0}

.sign.med{background:#ffffff;border-color:#e53935;color:#c62828}.sign.med span{color:#5b667a}

.sign.farm{background:#5a3b1c;border-color:#e8b45a;color:#ffe9b8}.sign.farm span{color:#ffd27a}

.sign.crop{padding:2px 8px;border-radius:8px;background:rgba(40,26,12,.88);border-color:#e8b45a}.sign.crop b{font:600 12px Fredoka,sans-serif}.sign.crop span{font-size:10.5px}

.sign.crop .up{color:#7dff9c}.sign.crop .dn{color:#ff8a8a}

.far .sign.crop{display:none}

.pop{pointer-events:none;font:13px 'Press Start 2P',monospace;white-space:nowrap;animation:popup 2.4s ease-out forwards;

  text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000,2px 2px #000,-2px -2px #000,2px -2px #000,-2px 2px #000}

.pop.up{color:#5dff7a}.pop.dn{color:#ff5d5d}.pop.gold{color:#ffd84d}

.pop small{font-size:9px;color:#fff}

@keyframes popup{0%{translate:0 8px;scale:.6;opacity:0}12%{translate:0 0;scale:1.15;opacity:1}25%{translate:0 -6px;scale:1}100%{translate:0 -70px;scale:1;opacity:0}}

.far .pop{font-size:9px}

#sPnlBox{cursor:pointer}#sPnlBox b.up{color:#5dff7a}#sPnlBox b.dn{color:#ff7a7a}

#sMineBox{cursor:pointer}#sMineBox b.up{color:#5dff7a}#sMineBox b.dn{color:#ff7a7a}

.sign.mine{background:#2b2418;border-color:#ffd24a;color:#ffe9a8}.sign.mine span{color:#ffcf5a}

.sign.ore{padding:2px 8px;border-radius:8px;background:rgba(30,24,14,.9);border-color:#ffd24a}.sign.ore b{font:600 12px Fredoka,sans-serif}.sign.ore span{font-size:10.5px}

.sign.ore .up{color:#7dff9c}.sign.ore .dn{color:#ff8a8a}.sign.ore.lim{border-color:#9ad0ff}

.far .sign.ore{display:none}

.tag.miner .tp{background:#ffc928;color:#1c2230;text-shadow:none}



dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:#1f2533;color:var(--ink);width:min(560px,calc(100vw - 32px));box-shadow:0 20px 50px rgba(0,0,0,.5)}

dialog::backdrop{background:rgba(5,8,14,.55)}

const CELL=.5;

  constructor(x0,z0,x1,z1){this.x0=x0+CELL/2;this.z0=z0+CELL/2;this.nx=Math.floor((x1-x0)/CELL);this.nz=Math.floor((z1-z0)/CELL);this.b=new Uint8Array(this.nx*this.nz)}

function fenceLine(g,ax,a,b,c,gap){const posts=[];

  for(let t=a;t<=b+.01;t+=1.5){if(gap&&t>gap[0]&&t<gap[1])continue;posts.push(t)}

  posts.forEach(t=>ax==="x"?box(g,.18,.9,.18,MC.plank,t,.2,c):box(g,.18,.9,.18,MC.plank,c,.2,t));

  const seg=(s,e)=>{const l=e-s,m=(s+e)/2;for(const y of[.15,.45])ax==="x"?box(g,l,.1,.08,MC.plank,m,y,c):box(g,.08,.1,l,MC.plank,c,y,m)};

  if(gap){seg(a,gap[0]);seg(gap[1],b)}else seg(a,b)}

function buildPark(L){
  seed = 2026;
  const P = L.park;
  if (!P) return;
  const hw = P.w / 2, hd = P.d / 2;
  const g = new THREE.Group(); g.position.set(P.cx, 0, P.cz); world.add(g);
  office.park = { g, P, spots: [] };

  const W = (x, z) => ({ x: x + P.cx, z: z + P.cz });
  const block = (a, b, c, d, pad = .1) => office.grid.block(a + P.cx, b + P.cz, c + P.cx, d + P.cz, pad);

  // 1. Lantai dasar rumput taman hijau segar
  box(g, P.w, .14, P.d, new THREE.MeshLambertMaterial({ color: 0x4caf50 }), 0, -.18, 0, { cast: false });

  // 2. Pagar kayu estetik keliling taman dengan pintu masuk di utara
  fenceLine(g, "x", -hw, hw, -hd, [-2.5, 2.5]);
  fenceLine(g, "x", -hw, hw, hd);
  fenceLine(g, "z", -hd, hd, -hw);
  fenceLine(g, "z", -hd, hd, hw);

  // Gerbang masuk kayu artistik (Arbor)
  for (const s of [-1, 1]) {
    box(g, .35, 3.2, .35, MC.plank, s * 2.4, 1.4, -hd);
  }
  box(g, 5.4, .35, .4, MC.plank, 0, 3.0, -hd);

  // Papan nama taman
  const parkTex = canvasTex(512, 128, (c, w, h) => {
    c.fillStyle = "#2e7d32"; c.fillRect(0, 0, w, h);
    c.strokeStyle = "#a5d6a7"; c.lineWidth = 8; c.strokeRect(6, 6, w - 12, h - 12);
    c.textAlign = "center"; c.textBaseline = "middle";
    c.font = "bold 26px 'Segoe UI',sans-serif";
    c.fillStyle = "#ffffff"; c.fillText("🌿 SEJATI CENTRAL PARK", w / 2, h / 2 - 12);
    c.font = "16px 'Segoe UI',sans-serif";
    c.fillStyle = "#c8e6c9"; c.fillText("Taman Terbuka Hijau & Ruang Santai", w / 2, h / 2 + 18);
  });
  box(g, 4.4, .95, .12, [MC.plank, MC.plank, MC.plank, MC.plank, new THREE.MeshLambertMaterial({ map: parkTex }), MC.plank], 0, 3.65, -hd + .15);

  // 3. Jalan setapak batu paving / cobblestone
  // Jalan masuk utama lurus dari utara ke tengah
  box(g, 3.2, .06, hd, 0xd7ccc8, 0, -.08, -hd / 2, { cast: false });
  // Plaza batu bundar/oktagonal di tengah mengelilingi air mancur
  cyl(g, 5.8, 5.8, .08, 0xd7ccc8, 0, -.07, 0, 16);
  // Jalan setapak timur-barat dari plaza tengah
  box(g, hw * 1.7, .06, 2.4, 0xd7ccc8, 0, -.08, 0, { cast: false });

  // 4. Air Mancur Bertingkat (Tiered Stone Fountain) di tengah
  const fountain = new THREE.Group(); fountain.position.set(0, 0, 0); g.add(fountain);
  cyl(fountain, 3.2, 3.4, .65, 0x8d6e63, 0, .25, 0, 20); // bibir kolam
  cyl(fountain, 2.8, 2.8, .62, 0x0288d1, 0, .28, 0, 20); // air biru
  cyl(fountain, .55, .7, 1.4, 0xa1887f, 0, .7, 0, 12);   // pilar
  cyl(fountain, 1.6, 1.8, .35, 0x8d6e63, 0, 1.4, 0, 16); // cawan tengah
  cyl(fountain, 1.45, 1.45, .32, 0x29b6f6, 0, 1.43, 0, 16);
  cyl(fountain, .8, .9, .25, 0x8d6e63, 0, 1.9, 0, 12);   // cawan atas
  cyl(fountain, .7, .7, .24, 0x4fc3f7, 0, 1.92, 0, 12);
  cyl(fountain, .15, .05, .45, 0xe0f7fa, 0, 2.2, 0, 8);  // semprotan
  block(-3.6, -3.6, 3.6, 3.6, .1);

  // 5. Gazebo Kayu Santai (Pergola) di sisi Barat
  const gzX = -hw + 8, gzZ = 0;
  const gz = new THREE.Group(); gz.position.set(gzX, 0, gzZ); g.add(gz);
  box(gz, 5.2, .2, 5.2, MC.plank, 0, .05, 0);
  for (const sx of [-2.2, 2.2]) for (const sz of [-2.2, 2.2]) {
    box(gz, .25, 2.8, .25, 0x5d4037, sx, 1.4, sz);
  }
  const gzRoof = new THREE.Mesh(new THREE.ConeGeometry(4.0, 1.6, 4), mat(0x4e342e));
  gzRoof.rotation.y = Math.PI / 4;
  gzRoof.position.set(0, 3.4, 0);
  gzRoof.castShadow = true;
  gz.add(gzRoof);
  cyl(gz, .8, .8, .65, MC.plank, 0, .45, 0, 10); // meja gazebo

  for (const a of [0, Math.PI / 2, Math.PI, Math.PI * 1.5]) {
    const kx = Math.cos(a) * 1.4, kz = Math.sin(a) * 1.4;
    box(gz, .5, .38, .5, 0x8d6e63, kx, .32, kz);
    office.spots.push({
      ...W(gzX + kx, gzZ + kz),
      face: a + Math.PI,
      act: "coffee",
      seat: W(gzX + kx, gzZ + kz),
      seatYaw: a + Math.PI,
      say: "☕ ngopi santai di gazebo taman"
    });
  }
  block(gzX - 2.8, gzZ - 2.8, gzX + 2.8, gzZ + 2.8, .1);

  // 6. Bangku Taman (Park Benches)
  const bench = (bx, bz, ry) => {
    const bg = new THREE.Group(); bg.position.set(bx, 0, bz); bg.rotation.y = ry; g.add(bg);
    for (const s of [-1, 1]) {
      box(bg, .08, .45, .55, 0x263238, s * .85, .22, 0);
    }
    box(bg, 1.9, .06, .5, 0x8d6e63, 0, .42, 0);
    box(bg, 1.9, .42, .06, 0x8d6e63, 0, .68, -.22);
    block(bx - 1.1, bz - .5, bx + 1.1, bz + .5, .05);
    office.spots.push({
      ...W(bx, bz),
      face: ry,
      act: "sit",
      seat: W(bx, bz),
      seatYaw: ry,
      say: "🌳 duduk santai menikmati angin sepoi-sepoi"
    });
  };

  bench(0, -4.6, 0);
  bench(0, 4.6, Math.PI);
  bench(4.8, 0, -Math.PI / 2);
  bench(hw - 6, -3.8, 0);
  bench(hw - 6, 3.8, Math.PI);

  // 7. Taman Bunga Warna-Warni
  const bed = (fx, fz, fw, fd, flowerColor) => {
    box(g, fw + .3, .18, fd + .3, 0x795548, fx, -.02, fz, { cast: false });
    box(g, fw, .22, fd, 0x4e342e, fx, -.01, fz, { cast: false });
    for (let ix = -fw / 2 + .4; ix <= fw / 2 - .4; ix += .7) {
      for (let iz = -fd / 2 + .4; iz <= fd / 2 - .4; iz += .7) {
        const fl = new THREE.Mesh(new THREE.DodecahedronGeometry(.18, 0), mat(flowerColor));
        fl.position.set(fx + ix + (srnd() - .5) * .15, .25, fz + iz + (srnd() - .5) * .15);
        fl.castShadow = true;
        g.add(fl);
        box(g, .04, .24, .04, 0x388e3c, fl.position.x, .1, fl.position.z, { cast: false });
      }
    }
    block(fx - fw / 2 - .15, fz - fd/ 2 - .15, fx + fw / 2 + .15, fz + fd / 2 + .15, .05);
  };

  bed(-6.5, -4.5, 4.2, 2.2, 0xe53935);
  bed(6.5, -4.5, 4.2, 2.2, 0xfdd835);
  bed(-6.5, 4.5, 4.2, 2.2, 0x9c27b0);
  bed(6.5, 4.5, 4.2, 2.2, 0x42a5f5);
  bed(hw - 10, 0, 3.6, 5.0, 0xff7043);

  // 8. Pohon Rindang & Pohon Sakura
  const parkTree = (tx, tz, isSakura = false) => {
    const tg = new THREE.Group(); tg.position.set(tx, 0, tz); g.add(tg);
    cyl(tg, .28, .36, 2.8, 0x5d4037, 0, 1.4, 0, 8);
    const leafColor = isSakura ? 0xf48fb1 : (srnd() < .5 ? 0x43a047 : 0x2e7d32);
    for (const [ly, r] of [[2.4, 1.8], [3.3, 1.4], [4.1, .9]]) {
      const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 1), mat(leafColor));
      leaves.position.set(0, ly, 0);
      leaves.castShadow = true;
      tg.add(leaves);
    }
    block(tx - .7, tz - .7, tx + .7, tz + .7, .1);
  };

  parkTree(-hw + 3, -hd + 3, true);
  parkTree(-hw + 3, hd - 3, false);
  parkTree(hw - 3, -hd + 3, false);
  parkTree(hw - 3, hd - 3, true);
  parkTree(hw - 14, -hd + 3.5, false);
  parkTree(hw - 14, hd - 3.5, true);

  // 9. Lampu Taman Klasik
  const lamp = (lx, lz) => {
    const lg = new THREE.Group(); lg.position.set(lx, 0, lz); g.add(lg);
    cyl(lg, .08, .12, 2.6, 0x263238, 0, 1.3, 0, 8);
    box(lg, .35, .08, .35, 0x263238, 0, 2.6, 0);
    const lantern = new THREE.Mesh(new THREE.BoxGeometry(.24, .32, .24), new THREE.MeshBasicMaterial({ color: 0xffe082 }));
    lantern.position.set(0, 2.45, 0);
    lg.add(lantern);
    block(lx - .2, lz - .2, lx + .2, lz + .2, .05);
  };

  lamp(-2.2, -hd + 1.2);
  lamp(2.2, -hd + 1.2);
  lamp(-4.2, -1.8);
  lamp(4.2, -1.8);
  lamp(-4.2, 1.8);
  lamp(4.2, 1.8);

  // 10. Spot jalan santai
  office.spots.push(
    { ...W(0, -1.8), face: Math.PI, act: "look", say: "⛲ melihat air mancur yang jernih" },
    { ...W(0, 1.8), face: 0, act: "look", say: "⛲ mendengarkan gemericik air mancur" },
    { ...W(-6.5, -2.8), face: Math.PI, act: "look", say: "🌹 menikmati wangi bunga mawar" },
    { ...W(6.5, -2.8), face: Math.PI, act: "look", say: "🌷 melihat bunga tulip kuning yang mekar" },
    { ...W(hw - 10, -3.2), face: 0, act: "stretch", say: "🍃 jalan santai hirup udara segar di taman" }
  );
}

function deskLayout(n,room){

  if(room.big){const per=Math.min(4,Math.ceil(n/2)||1),a=-room.hd+3.1,rows=n>per?[[per,a],[n-per,a+3.9]]:[[n,a]],out=[];

    rows.forEach(([c,z])=>{for(let i=0;i<c;i++)out.push({x:(i-(c-1)/2)*2.8,z,cub:true})});return out}

  const rows=n>4?[[4,-3.4],[n-4,-.4]]:[[n,-2]],out=[];

  rows.forEach(([c,z])=>{for(let i=0;i<c;i++)out.push({x:(i-(c-1)/2)*2.6,z})});return out}

async function load(){

    d._recv=Date.now()/1000;
    const sig=d.hosts.map(h=>h.key+":"+(h.agents||[]).map(a=>a.id).join(",")).join("|");
    data=d;

      const sig=d.hosts.map(h=>h.key+":"+(h.agents||[]).map(a=>a.id).join(",")).join("|");
      data=d;
      if(sig!==lastSig){

}

function focusOn(k,instant){focus.key=k;markTabs();if(!office.bounds)return;

  if(innerWidth<2||innerHeight<2){focus.pending=true;return}focus.pending=false;

  let rects,ys=[0,3.4];

  if(k==="all"){const B=office.bounds;rects=[[B.lot?B.lot.x0:B.x0,B.back?B.back.dc.z0:B.z0,B.x1,B.z1+6]]}

  else if(["mushola","chapel","altar","garden"].includes(k)){const sl=office.bounds.slots.find(x=>x.kind===k);if(!sl)return;rects=[[sl.x-sl.w/2,sl.z-sl.d/2,sl.x+sl.w/2,sl.z+sl.d/2]]}

  else if(k==="lot"){const T=office.bounds.lot;rects=[[T.x0,T.z0,T.x1,T.z1]];ys=[0,6]}

  else if(k==="park"||k==="taman"||k==="farm"||k==="mine"){const P=office.bounds.park;if(P)rects=[[P.x0+.5,P.z0+.5,P.x1-.5,P.z1-.5]];ys=[0,8]}

  else if(k==="lobby"||k==="medical"){const p=(k==="lobby"?office.lobby:office.medical)?.p;if(!p)return;rects=[[p.x-p.w/2,p.z-p.d/2,p.x+p.w/2,p.z+p.d/2]]}

  else{const r=office.rooms.find(r=>r.key===k);if(!r)return;rects=[[r.ox-r.W/2,r.oz-r.D/2,r.ox+r.W/2,r.oz+r.D/2]]}

  const dir=camera.position.clone().sub(controls.target).normalize();

  const m=new THREE.Matrix4().lookAt(dir,new THREE.Vector3(),new THREE.Vector3(0,1,0)),inv=m.clone().invert();

  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;const c=new THREE.Vector3();

  for(const[a,b,cc,d]of rects)for(const x of[a,cc])for(const y of ys)for(const z of[b,d]){const p=new THREE.Vector3(x,y,z).applyMatrix4(inv);x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)}

  c.set((x0+x1)/2,(y0+y1)/2,0).applyMatrix4(m);

  // geser target ke bidang lantai sepanjang arah pandang

  c.addScaledVector(dir,-c.y/dir.y);

  // area bebas = di bawah HUD atas & di atas bar bawah

  const top=($(".hud")?.getBoundingClientRect().bottom||0)+8,bot=innerWidth<760?44:52,free=Math.max(.35,(innerHeight-top-bot)/innerHeight);

  const a=innerWidth/innerHeight,pad=innerWidth<760?.92:.9;

  const z=Math.min(VIEW*a/(x1-x0),VIEW*free/(y1-y0))*pad;

  const up=new THREE.Vector3().setFromMatrixColumn(m,1),pxPerUnit=innerHeight/VIEW*z;

  c.addScaledVector(up,((top-bot)/2)/pxPerUnit);

  focus.fromT.copy(controls.target);focus.toT.copy(c);focus.fromZ=camera.zoom;focus.toZ=z;focus.fromOff.copy(camera.position).sub(controls.target);

  focus.anim=instant?1:.0001;if(instant)applyFocus(1)}

function applyFocus(k){const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

  controls.target.lerpVectors(focus.fromT,focus.toT,e);camera.zoom=focus.fromZ+(focus.toZ-focus.fromZ)*e;camera.updateProjectionMatrix();

  camera.position.copy(controls.target).add(focus.fromOff)}

function connectWS() {
  const protocol = location.protocol === "https:" ? "wss:" : "ws:";
  const wsUrl = `${protocol}//${location.host}/ws`;
  try {
    const ws = new WebSocket(wsUrl);
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === "agent_status") {
          const b = bots.get(msg.profile) || [...bots.values()].find(x => x.a.id === msg.profile);
          if (b) {
            b.setStatus(msg.status === "busy" ? "working" : msg.status, b.a);
            if (msg.task) {
              b.bubble = "⚡ " + msg.task.slice(0, 35);
              if (b.bubEl) b.bubEl.textContent = b.bubble;
            }
          }
        }
      } catch (err) {}
    };
    ws.onclose = () => setTimeout(connectWS, 4000);
  } catch (err) {}
}
